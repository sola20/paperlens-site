<!DOCTYPE html>

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand" data-go="feed">
      <div class="brand-mark">P</div>
      <div class="brand-txt"><b>PaperLens</b><span>Literature Radar</span></div>
    </div>

    <div class="nav-label">工作台</div>
    <div class="nav-item on" data-go="feed">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>文献流

    <div class="nav-item" data-go="mail">

    <div class="nav-label" style="margin-top:12px">个人</div>

      <span class="nav-badge green" id="nav-cmt">0</span>
    </div>
    <div class="nav-item" data-go="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2v.3a2 2 0 1 1-4 0v-.2A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 2.6 14H2.3a2 2 0 1 1 0-4h.2A1.7 1.7 0 0 0 4.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 2.6V2.3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 2.8 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.8h.3a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1.1z"/></svg>个人设置

    <div class="side-foot">
      <div class="sync-state" id="sync-state"><span class="pulse"></span><span id="sync-text">同步就绪</span></div>
      <div class="side-meta" id="sync-meta">—</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" title="菜单">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="crumb">工作台 / <b id="crumb">文献流</b></div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="global-search" placeholder="搜索标题、作者、关键词…" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </div>
      <div class="top-actions">
        <div class="icon-btn" id="btn-sync" title="立即同步">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        </div>
        <div class="icon-btn" id="btn-mail" title="发送今日文献邮件">
          <svg viewBox="0 0 24 24"><path d="M3 7l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
        </div>
        <div class="avatar" id="avatar" title="个人设置">研</div>
      </div>
    </header>
    <div class="scroll" id="view"></div>
  </div>
</div>
